<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Sour+Gummy:wght@500;800&display=swap"
      rel="stylesheet"
    />
    <title>Odin Library</title>
  </head>
  <body>
    <div><h1>~Library~</h1></div>
    <div class="carousel">
      <button class="nav prev" onclick="move(-1)">‹</button>

      <div class="stack" id="stack"></div>

      <button class="nav next" onclick="move(1)">›</button>
    </div>

    <button command="show-modal" commandfor="my-dialog" id="addBookButton">
      add book
    </button>

    <dialog id="my-dialog">
      <form class="book-form" id="addBook-form">
        <div class="form-group">
          <label for="title">Book Title</label>
          <input
            type="text"
            id="title"
            name="title"
            placeholder="Enter book title"
            required
          />
        </div>

        <div class="form-group">
          <label for="author">Book Author</label>
          <input
            type="text"
            id="author"
            name="author"
            placeholder="Enter author name"
            required
          />
        </div>

        <div class="form-group">
          <label for="pages">Book Pages</label>
          <input
            type="number"
            id="pages"
            name="pages"
            placeholder="Enter number of pages"
            min="1"
            required
          />
        </div>

        <fieldset class="form-group">
          <legend>Read Status</legend>

          <label>
            <input type="radio" name="readStatus" value="read" required />
            Read
          </label>

          <label>
            <input type="radio" name="readStatus" value="not yet read" />
            Not yet read
          </label>
        </fieldset>
      </form>
      <div class="dialogButtons">
        <button commandfor="my-dialog" command="close">Cancel</button>
        <input
          type="submit"
          value="Submit"
          form="addBook-form"
          id="submitBook"
        />
      </div>
    </dialog>

    <script src="script.js"></script>
  </body>
</html>
